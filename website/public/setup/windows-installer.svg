<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">OpenStream Windows installer screenshot</title>
  <desc id="desc">A screenshot-style installer wizard asking for the OBS Studio install folder.</desc>
  <rect width="960" height="540" fill="#111827"/>
  <rect x="150" y="70" width="660" height="400" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="150" y="70" width="660" height="54" rx="8" fill="#0f172a"/>
  <text x="180" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">OpenStream OBS Plugin Setup</text>
  <text x="194" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Choose OBS Studio Folder</text>
  <text x="194" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Install into the folder that contains bin\64bit\obs64.exe.</text>
  <rect x="194" y="242" width="520" height="44" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="214" y="270" font-family="Consolas, monospace" font-size="16" fill="#334155">C:\Program Files\obs-studio</text>
  <rect x="620" y="326" width="94" height="38" rx="6" fill="#00a37a"/>
  <text x="648" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Next</text>
  <rect x="512" y="326" width="94" height="38" rx="6" fill="#e2e8f0"/>
  <text x="535" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Back</text>
  <rect x="194" y="388" width="520" height="44" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="214" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#155e75">Restart OBS after the installer finishes.</text>
</svg>
