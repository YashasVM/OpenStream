  <text x="708" y="419" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">Add source, choose OpenStream</text>
  <rect x="80" y="402" width="528" height="54" rx="6" fill="#111827" stroke="#334155"/>
  <text x="104" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">Auto-connect: enabled | Port: 9000 | Latency: 120 ms</text>
</svg>
