<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">OBS OpenStream source screenshot</title>
  <desc id="desc">A screenshot-style OBS window showing the OpenStream source in the source list.</desc>
  <rect width="960" height="540" fill="#020617"/>
  <rect x="52" y="44" width="856" height="452" rx="8" fill="#1f2937"/>
  <rect x="80" y="76" width="528" height="300" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="286" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#94a3b8">OpenStream waits for phone</text>
  <rect x="636" y="76" width="232" height="300" rx="6" fill="#111827" stroke="#334155"/>
  <text x="660" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Sources</text>
  <rect x="660" y="142" width="184" height="42" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="678" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ecfdf5">OpenStream</text>
  <circle cx="674" cy="414" r="18" fill="#00a37a"/>
