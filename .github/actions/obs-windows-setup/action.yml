name: OBS Windows setup
description: Shared OBS Studio download/verify and Qt install for Windows plugin builds.
inputs:
  obs-version:
    description: OBS Studio version to download.
    default: 32.2.1
  obs-sha256:
    description: Expected SHA256 of the OBS Studio zip.
    default: db64a2934f8261f85b1410b84be011207a0afda5400d008289f1f1e211bcc7de
  qt-version:
    description: Qt version to install.
    default: 6.8.3
runs:
  using: composite
  steps:
    - name: Install OBS Studio ${{ inputs.obs-version }}
      shell: powershell
      run: |
        $url = "https://github.com/obsproject/obs-studio/releases/download/${{ inputs.obs-version }}/OBS-Studio-${{ inputs.obs-version }}-Windows-x64.zip"
        $archive = "$env:RUNNER_TEMP\obs-studio.zip"
        $destination = "$env:RUNNER_TEMP\obs-studio"
        & curl.exe -L --fail --retry 3 -o $archive $url
        if ($LASTEXITCODE -ne 0) { throw "OBS Studio download failed" }
        $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        $expected = "${{ inputs.obs-sha256 }}"
        if ($actual -ne $expected) { throw "OBS Studio checksum mismatch" }
        Expand-Archive -Path $archive -DestinationPath $destination
        "OPENSTREAM_OBS_INSTALL=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install matching Qt development files
      shell: powershell
      run: |
        python -m pip install --disable-pip-version-check aqtinstall
        python -m aqt install-qt windows desktop ${{ inputs.qt-version }} win64_msvc2022_64 -O C:\Qt
        "OPENSTREAM_QT_ROOT=C:\Qt\${{ inputs.qt-version }}\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
