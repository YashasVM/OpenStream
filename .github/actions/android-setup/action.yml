name: Android SDK setup
description: Shared Python/JDK/Android SDK setup for Android APK builds.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Install Android build packages
      shell: bash
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
