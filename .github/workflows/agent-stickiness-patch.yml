name: Agent reconnect stickiness patch

on:
  push:
    branches: [agent-dev]
    paths:
      - .github/workflows/agent-stickiness-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-dev
          fetch-depth: 0
      - name: Apply reconnect stickiness fix
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('obs-plugin/src/openstream-source.cpp')
          source = source_path.read_text(encoding='utf-8')

          old = '''void openstream_worker(OpenStreamSource *ctx, std::string base_srt_url, std::string selected_phone_id) {
            avformat_network_init();

            while (!ctx->stop_requested.load()) {'''
          new = '''void openstream_worker(OpenStreamSource *ctx, std::string base_srt_url, std::string selected_phone_id) {
            avformat_network_init();

            const bool auto_phone_selection =
                selected_phone_id.empty() || selected_phone_id == PhoneDiscoveryReceiver::kAutoPhoneId;
            std::string reconnect_phone_id;
            auto reconnect_deadline = std::chrono::steady_clock::time_point::min();
            const auto hold_phone_for_reconnect = [&](const std::optional<PhoneDevice> &phone) {
              if (!auto_phone_selection || !phone.has_value()) {
                return;
              }
              reconnect_phone_id = phone->instance_id;
              reconnect_deadline = std::chrono::steady_clock::now() + kReconnectReservationWindow;
            };

            while (!ctx->stop_requested.load()) {'''
          if old not in source:
              raise SystemExit('openstream_worker anchor not found')
          source = source.replace(old, new, 1)

          old = '''      while (!ctx->stop_requested.load()) {
                phone = ctx->phone_discovery.select(selected_phone_id, ctx->instance_id);
                if (phone.has_value() && reserve_phone(ctx, *phone)) {
                  break;
                }
                if (selected_phone_id.empty() || selected_phone_id == PhoneDiscoveryReceiver::kAutoPhoneId) {
                  blog(LOG_INFO, "[OpenStream] Waiting for available Android phone");
                } else {
                  blog(LOG_INFO, "[OpenStream] Waiting for selected Android phone");
                }
                std::this_thread::sleep_for(std::chrono::milliseconds(1000));
              }'''
          new = '''      while (!ctx->stop_requested.load()) {
                std::string effective_phone_id = selected_phone_id;
                if (auto_phone_selection && !reconnect_phone_id.empty()) {
                  if (std::chrono::steady_clock::now() < reconnect_deadline) {
                    effective_phone_id = reconnect_phone_id;
                  } else {
                    blog(LOG_INFO,
                         "[OpenStream] Reconnect hold expired; allowing %s to choose another phone",
                         ctx->slot_label.c_str());
                    reconnect_phone_id.clear();
                  }
                }
                phone = ctx->phone_discovery.select(effective_phone_id, ctx->instance_id);
                if (phone.has_value() && reserve_phone(ctx, *phone)) {
                  hold_phone_for_reconnect(phone);
                  break;
                }
                if (auto_phone_selection && !reconnect_phone_id.empty()) {
                  blog(LOG_INFO, "[OpenStream] Waiting for previously connected Android phone");
                } else if (auto_phone_selection) {
                  blog(LOG_INFO, "[OpenStream] Waiting for available Android phone");
                } else {
                  blog(LOG_INFO, "[OpenStream] Waiting for selected Android phone");
                }
                std::this_thread::sleep_for(std::chrono::milliseconds(1000));
              }'''
          if old not in source:
              raise SystemExit('selection loop anchor not found')
          source = source.replace(old, new, 1)

          old = '''        if (reserved_phone.has_value()) {
                  set_slot_status(ctx, "Reconnecting");
                  set_active_phone(ctx, reserved_phone);
                } else {'''
          new = '''        if (reserved_phone.has_value()) {
                  hold_phone_for_reconnect(reserved_phone);
                  set_slot_status(ctx, "Reconnecting");
                  set_active_phone(ctx, reserved_phone);
                } else {'''
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 reconnect failure anchors, found {count}')
          source = source.replace(old, new)

          old = '''    if (!ctx->stop_requested.load()) {
              set_slot_status(ctx, "Reconnecting");
              blog(LOG_INFO, "[OpenStream] Holding %s for reconnect",
                   ctx->slot_label.c_str());'''
          new = '''    if (!ctx->stop_requested.load()) {
              hold_phone_for_reconnect(reserved_phone);
              set_slot_status(ctx, "Reconnecting");
              blog(LOG_INFO, "[OpenStream] Holding %s for reconnect",
                   ctx->slot_label.c_str());'''
          if old not in source:
              raise SystemExit('disconnect reconnect anchor not found')
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_repo_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''def test_android_discovery_ui_parses_and_displays_obs_slots() -> None:\n'''
          test = '''def test_auto_selected_obs_slot_sticks_to_same_phone_during_reconnect_hold() -> None:\n    source = read("obs-plugin/src/openstream-source.cpp")\n    assert "auto_phone_selection" in source\n    assert "reconnect_phone_id" in source\n    assert "reconnect_deadline" in source\n    assert "kReconnectReservationWindow" in source\n    assert "effective_phone_id = reconnect_phone_id" in source\n    assert "Reconnect hold expired; allowing %s to choose another phone" in source\n    assert "hold_phone_for_reconnect(reserved_phone)" in source\n    assert "Waiting for previously connected Android phone" in source\n\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(marker, test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          workflow = Path('.github/workflows/agent-stickiness-patch.yml')
          workflow.unlink()
      - name: Run focused contracts
        run: python -m pytest -q tests/test_repo_contract.py
      - name: Commit patch to agent-dev
        run: |
          git config user.name "OpenStream Agent Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add obs-plugin/src/openstream-source.cpp tests/test_repo_contract.py .github/workflows/agent-stickiness-patch.yml
          git commit -m "Keep auto camera slots sticky during reconnect"
          git push origin HEAD:agent-dev
