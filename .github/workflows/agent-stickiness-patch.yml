name: Agent reconnect stickiness patch

on:
  push:
    branches: [agent-dev]
    paths:
      - .github/workflows/agent-stickiness-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-dev
          fetch-depth: 0
      - name: Apply reconnect stickiness fix
        shell: python
        run: |
          from pathlib import Path
          import re

          source_path = Path('obs-plugin/src/openstream-source.cpp')
          source = source_path.read_text(encoding='utf-8')

          prelude = '''void openstream_worker(OpenStreamSource *ctx, std::string base_srt_url, std::string selected_phone_id) {
            avformat_network_init();

            while (!ctx->stop_requested.load()) {'''
          prelude_new = '''void openstream_worker(OpenStreamSource *ctx, std::string base_srt_url, std::string selected_phone_id) {
            avformat_network_init();

            const bool auto_phone_selection =
                selected_phone_id.empty() || selected_phone_id == PhoneDiscoveryReceiver::kAutoPhoneId;
            std::string reconnect_phone_id;
            auto reconnect_deadline = std::chrono::steady_clock::time_point::min();
            const auto hold_phone_for_reconnect = [&](const std::optional<PhoneDevice> &phone) {
              if (!auto_phone_selection || !phone.has_value()) {
                return;
              }
              reconnect_phone_id = phone->instance_id;
              reconnect_deadline = std::chrono::steady_clock::now() + kReconnectReservationWindow;
            };

            while (!ctx->stop_requested.load()) {'''
          if source.count(prelude) != 1:
              raise SystemExit(f'worker prelude count was {source.count(prelude)}')
          source = source.replace(prelude, prelude_new, 1)

          call = '      phone = ctx->phone_discovery.select(selected_phone_id, ctx->instance_id);'
          call_new = '''      std::string effective_phone_id = selected_phone_id;
                if (auto_phone_selection && !reconnect_phone_id.empty()) {
                  if (std::chrono::steady_clock::now() < reconnect_deadline) {
                    effective_phone_id = reconnect_phone_id;
                  } else {
                    blog(LOG_INFO,
                         "[OpenStream] Reconnect hold expired; allowing %s to choose another phone",
                         ctx->slot_label.c_str());
                    reconnect_phone_id.clear();
                  }
                }
                phone = ctx->phone_discovery.select(effective_phone_id, ctx->instance_id);'''
          if source.count(call) != 1:
              raise SystemExit(f'selection call count was {source.count(call)}')
          source = source.replace(call, call_new, 1)

          pattern = r'(?m)^(\s*)if \(phone\.has_value\(\) && reserve_phone\(ctx, \*phone\)\) \{\s*$'
          source, count = re.subn(pattern, lambda m: m.group(0) + '\n' + m.group(1) + '  hold_phone_for_reconnect(phone);', source, count=1)
          if count != 1:
              raise SystemExit(f'reservation success insertion count was {count}')

          wait_pattern = re.compile(r'(?m)^(\s*)if \(selected_phone_id\.empty\(\) \|\| selected_phone_id == PhoneDiscoveryReceiver::kAutoPhoneId\) \{\s*$')
          def replace_wait(match):
              indent = match.group(1)
              return (indent + 'if (auto_phone_selection && !reconnect_phone_id.empty()) {\n'
                      + indent + '  blog(LOG_INFO, "[OpenStream] Waiting for previously connected Android phone");\n'
                      + indent + '} else if (auto_phone_selection) {')
          source, count = wait_pattern.subn(replace_wait, source, count=1)
          if count != 1:
              raise SystemExit(f'waiting condition replacement count was {count}')

          reconnect_pattern = re.compile(r'(?m)^(\s*)if \(reserved_phone\.has_value\(\)\) \{\n(\s*)set_slot_status\(ctx, "Reconnecting"\);')
          def replace_reconnect(match):
              return (match.group(1) + 'if (reserved_phone.has_value()) {\n'
                      + match.group(2) + 'hold_phone_for_reconnect(reserved_phone);\n'
                      + match.group(2) + 'set_slot_status(ctx, "Reconnecting");')
          source, count = reconnect_pattern.subn(replace_reconnect, source)
          if count != 2:
              raise SystemExit(f'reconnect failure insertion count was {count}')

          disconnect_pattern = re.compile(r'(?m)^(\s*)if \(!ctx->stop_requested\.load\(\)\) \{\n(\s*)set_slot_status\(ctx, "Reconnecting"\);\n(\s*)blog\(LOG_INFO, "\[OpenStream\] Holding %s for reconnect",')
          def replace_disconnect(match):
              return (match.group(1) + 'if (!ctx->stop_requested.load()) {\n'
                      + match.group(2) + 'hold_phone_for_reconnect(reserved_phone);\n'
                      + match.group(2) + 'set_slot_status(ctx, "Reconnecting");\n'
                      + match.group(3) + 'blog(LOG_INFO, "[OpenStream] Holding %s for reconnect",')
          source, count = disconnect_pattern.subn(replace_disconnect, source, count=1)
          if count != 1:
              raise SystemExit(f'disconnect insertion count was {count}')

          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_repo_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_android_discovery_ui_parses_and_displays_obs_slots() -> None:\n'
          test = '''def test_auto_selected_obs_slot_sticks_to_same_phone_during_reconnect_hold() -> None:\n    source = read("obs-plugin/src/openstream-source.cpp")\n    assert "auto_phone_selection" in source\n    assert "reconnect_phone_id" in source\n    assert "reconnect_deadline" in source\n    assert "kReconnectReservationWindow" in source\n    assert "effective_phone_id = reconnect_phone_id" in source\n    assert "Reconnect hold expired; allowing %s to choose another phone" in source\n    assert "hold_phone_for_reconnect(reserved_phone)" in source\n    assert "Waiting for previously connected Android phone" in source\n\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'test insertion anchor count was {tests.count(marker)}')
          tests = tests.replace(marker, test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/agent-stickiness-patch.yml').unlink()
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused contracts
        run: python -m pytest -q tests/test_repo_contract.py
      - name: Commit patch to agent-dev
        run: |
          git config user.name "OpenStream Agent Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add obs-plugin/src/openstream-source.cpp tests/test_repo_contract.py .github/workflows/agent-stickiness-patch.yml
          git commit -m "Keep auto camera slots sticky during reconnect"
          git push origin HEAD:agent-dev
