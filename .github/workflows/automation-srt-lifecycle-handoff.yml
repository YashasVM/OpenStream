name: One-shot SRT lifecycle handoff fix

on:
  push:
    branches:
      - codex/restore-legacy-stability
    paths:
      - .github/workflows/automation-srt-lifecycle-handoff.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/restore-legacy-stability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Apply generation-guarded native lifecycle handoff
        run: python tools/automation_srt_lifecycle_fix.py

      - name: Run repository contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q

      - name: Validate Android unit tests, lint, and APK
        working-directory: android
        env:
          OPENSTREAM_VERSION_NAME: 1.0.1
          OPENSTREAM_VERSION_CODE: 1
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Commit validated fix and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/automation-srt-lifecycle-handoff.yml tools/automation_srt_lifecycle_fix.py
          git config user.name "OpenStream Maintainer"
          git config user.email "actions@github.com"
          git add android/app/src/main/java/dev/openstream/app/stream/SrtStreamClient.kt android/app/src/main/cpp/openstream_srt.cpp tests/test_srt_native_lifecycle_handoff_contract.py tests/test_srt_address_fallback_contract.py tests/test_srt_stream_client_session_contract.py .github/workflows/automation-srt-lifecycle-handoff.yml tools/automation_srt_lifecycle_fix.py
          git commit -m "Fix native SRT lifecycle handoff race"
          git push origin HEAD:codex/restore-legacy-stability
