name: One-shot SRT lifecycle handoff fix

on:
  push:
    branches:
      - codex/restore-legacy-stability
    paths:
      - .github/workflows/automation-srt-lifecycle-handoff.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/restore-legacy-stability
          fetch-depth: 0

      - name: Apply generation-guarded native lifecycle handoff
        shell: bash
        run: |
          echo ' ' | tr -d ' ' | base64 -d > /tmp/openstream_fix.py
          python3 /tmp/openstream_fix.py

      - name: Run repository contracts
        run: python3 -m pytest -q

      - name: Validate Android unit tests, lint, and APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/automation-srt-lifecycle-handoff.yml
          git config user.name "OpenStream Maintainer"
          git config user.email "actions@github.com"
          git add android/app/src/main/java/dev/openstream/app/stream/SrtStreamClient.kt android/app/src/main/cpp/openstream_srt.cpp tests/test_srt_native_lifecycle_handoff_contract.py .github/workflows/automation-srt-lifecycle-handoff.yml
          git commit -m "Fix native SRT lifecycle handoff race"
          git push origin HEAD:codex/restore-legacy-stability
