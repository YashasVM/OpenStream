name: Release candidate

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Build an unpublished candidate or publish a previously staged candidate
        required: true
        default: candidate
        type: choice
        options: [candidate, publish]
      tag:
        description: Release tag (required for manual runs)
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate workflow run ID (publish mode only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    name: Build Android candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Run repository tests and Android lint
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Check tag and read the single version source
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^productVersion=//p' release/version.properties)
          VERSION_CODE=$(sed -n 's/^androidVersionCode=//p' release/version.properties)
          [[ "$(grep -c '^productVersion=' release/version.properties)" == 1 ]]
          [[ "$(grep -c '^androidVersionCode=' release/version.properties)" == 1 ]]
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || { echo "::error::Tag $RELEASE_TAG does not match release/version.properties ($VERSION)."; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && (( VERSION_CODE <= 2100000000 )) || { echo "::error::Invalid androidVersionCode: $VERSION_CODE"; exit 1; }
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          [[ "$TAG_COMMIT" == "$(git rev-parse HEAD)" ]] || { echo "::error::Tag commit does not match checked out source."; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag moved after this run started."; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Require Android signing inputs
        env:
          OPENSTREAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPENSTREAM_RELEASE_KEYSTORE_BASE64 }}
          OPENSTREAM_RELEASE_STORE_PASSWORD: ${{ secrets.OPENSTREAM_RELEASE_STORE_PASSWORD }}
          OPENSTREAM_RELEASE_KEY_ALIAS: ${{ secrets.OPENSTREAM_RELEASE_KEY_ALIAS }}
          OPENSTREAM_RELEASE_KEY_PASSWORD: ${{ secrets.OPENSTREAM_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$OPENSTREAM_RELEASE_KEYSTORE_BASE64" && test -n "$OPENSTREAM_RELEASE_STORE_PASSWORD" && test -n "$OPENSTREAM_RELEASE_KEY_ALIAS" && test -n "$OPENSTREAM_RELEASE_KEY_PASSWORD" || { echo "::error::Public candidates require all Android signing secrets."; exit 1; }
      - name: Decode Android signing key
        env:
          OPENSTREAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPENSTREAM_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$OPENSTREAM_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/openstream-release.keystore
      - name: Build signed release APK with native SRT
        working-directory: android
        env:
          OPENSTREAM_RELEASE_KEYSTORE: ${{ github.workspace }}/android/app/openstream-release.keystore
          OPENSTREAM_RELEASE_STORE_PASSWORD: ${{ secrets.OPENSTREAM_RELEASE_STORE_PASSWORD }}
          OPENSTREAM_RELEASE_KEY_ALIAS: ${{ secrets.OPENSTREAM_RELEASE_KEY_ALIAS }}
          OPENSTREAM_RELEASE_KEY_PASSWORD: ${{ secrets.OPENSTREAM_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Normalize candidate APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/openstream-android.apk
          python tools/check_android_16kb_alignment.py artifacts/openstream-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ github.run_id }}
          path: artifacts/openstream-android.apk
          if-no-files-found: error

  obs-plugin-windows:
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    name: Build Windows OBS candidate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/obs-windows-setup
      - name: Build plugin package
        shell: cmd
        run: |
          set OPENSTREAM_SKIP_INSTALL=1
          set OPENSTREAM_PLUGIN_PACKAGE_DIR=%CD%\artifacts
          call build_plugin.bat
      - name: Run native and repository tests
        shell: powershell
        run: |
          ctest --test-dir obs-plugin/build --output-on-failure
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q
      - name: Verify Windows package and dependencies
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin.exe was not found' }
          $deps = (& $dumpbin.FullName /dependents "$PWD\obs-plugin\build\openstream-obs.dll") -join "`n"
          'avformat-62.dll','avcodec-62.dll','avutil-60.dll','swscale-9.dll' | ForEach-Object { if ($deps -notmatch [regex]::Escape($_)) { throw "Missing expected dependency $_" } }
          & tools\installer\Test-OpenStreamPackage.ps1 -ZipPath "$PWD\artifacts\openstream-obs-windows-x64.zip"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build and inspect Windows installer
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content release/version.properties | Where-Object { $_ -match '^productVersion=' }) -replace '^productVersion=', ''
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag does not match product version $version" }
          $env:OPENSTREAM_VERSION = $version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "tools\installer\openstream-obs-plugin.iss" "/DPluginDll=$PWD\obs-plugin\build\openstream-obs.dll" "/DOutputDir=$PWD\artifacts" "/DOutputBaseFilename=openstream-obs-plugin-installer-windows-x64" "/DOpenStreamVersion=$version"
          & tools\installer\Test-OpenStreamInnoInstaller.ps1 -InstallerPath "$PWD\artifacts\openstream-obs-plugin-installer-windows-x64.exe"
          $info = (Get-Item "$PWD\artifacts\openstream-obs-plugin-installer-windows-x64.exe").VersionInfo
          if ($info.ProductVersion -ne $version) { throw "Installer ProductVersion '$($info.ProductVersion)' does not match $version" }
          @{ productVersion = $info.ProductVersion; fileVersion = $info.FileVersion } | ConvertTo-Json | Set-Content artifacts\windows-installer-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.run_id }}
          path: |
            artifacts/openstream-obs-windows-x64.zip
            artifacts/openstream-obs-plugin-installer-windows-x64.exe
            artifacts/windows-installer-metadata.json
          if-no-files-found: error

  obs-plugin-linux:
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    name: Build Linux OBS candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ pkg-config libobs-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev qt6-base-dev
      - name: Build, test, and package Linux plugin
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          OPENSTREAM_PLUGIN_PACKAGE_DIR: ${{ github.workspace }}/artifacts
        run: |
          export OPENSTREAM_VERSION="${RELEASE_TAG#v}"
          ./build_plugin_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.run_id }}
          path: artifacts/shin-obs-linux-x86_64.tar.gz
          if-no-files-found: error

  stage-candidate:
    if: github.event_name == 'push' || inputs.mode == 'candidate'
    name: Verify and stage release candidate (unpublished)
    runs-on: ubuntu-latest
    needs: [android, obs-plugin-windows, obs-plugin-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Fetch previous published APK when one exists
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          previous=$(python -c 'import json,sys; rs=json.load(open(sys.argv[1])); xs=[r for r in rs if not r["draft"] and not r["prerelease"]]; print(xs[0]["tag_name"] if xs else "")' "$RUNNER_TEMP/releases.json")
          if [[ -n "$previous" ]]; then
            gh release download "$previous" --pattern openstream-android.apk --dir "$RUNNER_TEMP/previous"
            test -s "$RUNNER_TEMP/previous/openstream-android.apk"
            echo "apk=$RUNNER_TEMP/previous/openstream-android.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify actual artifacts and write release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^productVersion=//p' release/version.properties)
          VERSION_CODE=$(sed -n 's/^androidVersionCode=//p' release/version.properties)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)
          [[ -n "$APKSIGNER" && -n "$AAPT" ]]
          args=(--artifacts artifacts --tag "$RELEASE_TAG" --expected-version "$VERSION" --expected-version-code "$VERSION_CODE" --installer-metadata artifacts/windows-installer-metadata.json --aapt "$AAPT" --apksigner "$APKSIGNER" --commit "$(git rev-parse HEAD)" --write-manifest artifacts/release-manifest.json)
          if [[ -n "${{ steps.previous.outputs.apk }}" ]]; then args+=(--previous-apk "${{ steps.previous.outputs.apk }}"); fi
          python tools/check_release_artifacts.py "${args[@]}"
          for file in openstream-android.apk openstream-obs-windows-x64.zip openstream-obs-plugin-installer-windows-x64.exe shin-obs-linux-x86_64.tar.gz; do
            sha256sum "artifacts/$file" > "artifacts/$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.tag || github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  publish-staged-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    name: Publish verified staged candidate bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Require candidate run ID and download its bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::candidate_run_id must identify a successful staging run."; exit 1; }
          candidate=$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,headSha,event)
          [[ "$(jq -r .conclusion <<< "$candidate")" == success ]] || { echo "::error::Candidate run did not succeed."; exit 1; }
          [[ "$(jq -r .headSha <<< "$candidate")" == "$(git rev-parse HEAD)" ]] || { echo "::error::Candidate run commit differs from the release tag commit."; exit 1; }
          mkdir -p artifacts
          gh run download "$CANDIDATE_RUN_ID" --name "release-candidate-$RELEASE_TAG" --dir artifacts
      - name: Verify staged hashes and metadata against the manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^productVersion=//p' release/version.properties)
          VERSION_CODE=$(sed -n 's/^androidVersionCode=//p' release/version.properties)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)
          [[ -n "$APKSIGNER" && -n "$AAPT" ]]
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          previous=$(python -c 'import json,sys; rs=json.load(open(sys.argv[1])); xs=[r for r in rs if not r["draft"] and not r["prerelease"]]; print(xs[0]["tag_name"] if xs else "")' "$RUNNER_TEMP/releases.json")
          args=(--artifacts artifacts --tag "$RELEASE_TAG" --expected-version "$VERSION" --expected-version-code "$VERSION_CODE" --installer-metadata artifacts/windows-installer-metadata.json --aapt "$AAPT" --apksigner "$APKSIGNER" --commit "$(git rev-parse HEAD)" --manifest artifacts/release-manifest.json)
          if [[ -n "$previous" ]]; then
            gh release download "$previous" --pattern openstream-android.apk --dir "$RUNNER_TEMP/previous"
            args+=(--previous-apk "$RUNNER_TEMP/previous/openstream-android.apk")
          fi
          python tools/check_release_artifacts.py "${args[@]}"
          for file in openstream-android.apk openstream-obs-windows-x64.zip openstream-obs-plugin-installer-windows-x64.exe shin-obs-linux-x86_64.tar.gz; do
            (cd artifacts && sha256sum --check "$file.sha256")
          done
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            artifacts/openstream-android.apk artifacts/openstream-android.apk.sha256 \
            artifacts/openstream-obs-plugin-installer-windows-x64.exe artifacts/openstream-obs-plugin-installer-windows-x64.exe.sha256 \
            artifacts/openstream-obs-windows-x64.zip artifacts/openstream-obs-windows-x64.zip.sha256 \
            artifacts/shin-obs-linux-x86_64.tar.gz artifacts/shin-obs-linux-x86_64.tar.gz.sha256 \
            artifacts/release-manifest.json \
            --target "$(git rev-parse HEAD)" --title "OpenStream $RELEASE_TAG" --notes-file docs/release-notes-template.md
