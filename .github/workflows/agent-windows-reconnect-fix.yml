name: Agent Windows reconnect compile fix

on:
  push:
    branches: [agent-dev]
    paths:
      - .github/workflows/agent-windows-reconnect-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-dev
          fetch-depth: 0
      - name: Fix Windows min macro collision
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('obs-plugin/src/openstream-source.cpp')
          source = source_path.read_text(encoding='utf-8')
          old = 'auto reconnect_deadline = std::chrono::steady_clock::time_point::min();'
          new = 'auto reconnect_deadline = std::chrono::steady_clock::time_point{};'
          if source.count(old) != 1:
              raise SystemExit(f'expected one reconnect deadline initializer, found {source.count(old)}')
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_repo_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    assert "reconnect_deadline" in source\n'
          addition = '    assert "std::chrono::steady_clock::time_point{}" in source\n    assert "time_point::min()" not in source\n'
          if anchor in tests and addition not in tests:
              tests = tests.replace(anchor, anchor + addition, 1)
              test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/agent-windows-reconnect-fix.yml').unlink()
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run reconnect contracts
        run: python -m pytest -q tests/test_repo_contract.py
      - name: Commit fix
        run: |
          git config user.name "OpenStream Agent Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add obs-plugin/src/openstream-source.cpp tests/test_repo_contract.py .github/workflows/agent-windows-reconnect-fix.yml
          git commit -m "Fix Windows reconnect deadline build"
          git push origin HEAD:agent-dev
