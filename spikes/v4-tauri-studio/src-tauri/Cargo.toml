[package]
name = "openstream-tauri-studio-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "openstream_tauri_studio_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openstream-tauri-studio-spike"
path = "src/main.rs"

[[bin]]
name = "openstream-tauri-pipe-service"
path = "src/bin/pipe-service.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.0", features = ["v4"] }
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
